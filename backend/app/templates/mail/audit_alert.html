<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Peringatan Forensik Klaim — ClaimTrace JKN</title>
</head>
<body style="font-family: 'Plus Jakarta Sans', Arial, sans-serif; background:#f4f7f7; padding:24px; color:#0f172a;">
  <div style="max-width:620px; margin:0 auto; background:#ffffff; border:1px solid #fecdd3; border-radius:12px; overflow:hidden;">
    <div style="background:#be123c; color:#ffffff; padding:20px 24px;">
      <div style="font-size:12px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.9;">ClaimTrace Forensik · Peringatan Prioritas</div>
      <h1 style="margin:6px 0 0; font-size:20px;">{{ alert_title }}</h1>
    </div>
    <div style="padding:24px; font-size:14px; line-height:1.6;">
      <p><strong>Severitas:</strong> {{ severity }}</p>
      <p>{{ summary }}</p>
      <p style="font-size:12px; color:#475569;">Referensi Sistem: {{ reference_id }}</p>
    </div>
  </div>
</body>
</html>
