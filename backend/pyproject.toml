[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["alembic/versions", "data", "backups", ".pytest_cache"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101", "B104", "B105", "B106", "B110", "B311", "B404", "B603"]
