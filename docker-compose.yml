version: '3.8'

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: claimtrace-reverse-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/proxy-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: claimtrace-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-claimtrace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-claimtrace_local_dev}
      - POSTGRES_DB=${POSTGRES_DB:-claimtrace_db}
    volumes:
      - claimtrace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimtrace} -d ${POSTGRES_DB:-claimtrace_db}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: claimtrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - claimtrace_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimtrace-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - CLAIMTRACE_LLM_ENDPOINT=${CLAIMTRACE_LLM_ENDPOINT:-}
      - CLAIMTRACE_LLM_API_KEY=${CLAIMTRACE_LLM_API_KEY:-}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-claimtrace}:${POSTGRES_PASSWORD:-claimtrace_local_dev}@postgres:5432/${POSTGRES_DB:-claimtrace_db}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-claimtrace_minio}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-claimtrace_minio_secret_2026}
      - KEYCLOAK_URL=http://keycloak:8080
      - CLAIMTRACE_TRUST_PROXY_HEADERS=1
      - CLAIMTRACE_BACKUP_DIR=/app/backups
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - claimtrace_backups_data:/app/backups

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimtrace-async-worker
    restart: unless-stopped
    command: ["python3", "-m", "arq", "app.workers.async_worker.WorkerSettings"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-claimtrace}:${POSTGRES_PASSWORD:-claimtrace_local_dev}@postgres:5432/${POSTGRES_DB:-claimtrace_db}
      - REDIS_URL=redis://redis:6379/0
      - CLAIMTRACE_BACKUP_DIR=/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - claimtrace_backups_data:/app/backups

  backup-scheduler:
    image: postgres:16-alpine
    container_name: claimtrace-backup-scheduler
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-claimtrace}
      - PGPASSWORD=${POSTGRES_PASSWORD:-claimtrace_local_dev}
      - PGDATABASE=${POSTGRES_DB:-claimtrace_db}
      - BACKUP_RETENTION_DAYS=${CLAIMTRACE_BACKUP_RETENTION_COUNT:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/data:ro
      - claimtrace_backups_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 19 * * * /bin/sh -c 'TS=$$(date -u +%Y%m%d-%H%M%S); mkdir -p /backups/tmp_$$TS && pg_dump --no-owner --no-privileges -f /backups/tmp_$$TS/claimtrace_db.sql && cp /data/*.json /data/*.jsonl /backups/tmp_$$TS/ 2>/dev/null || true; tar -czf /backups/claimtrace-backup-$$TS.tar.gz -C /backups tmp_$$TS && rm -rf /backups/tmp_$$TS && sha256sum /backups/claimtrace-backup-$$TS.tar.gz > /backups/claimtrace-backup-$$TS.sha256 && find /backups -name \"claimtrace-backup-*.tar.gz\" -mtime +$${BACKUP_RETENTION_DAYS:-14} -delete'" > /etc/crontabs/root
        crond -f -l 6

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: claimtrace-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - claimtrace_prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.0
    container_name: claimtrace-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-claimtrace2026}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/claimtrace-observability.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - claimtrace_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: claimtrace-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-claimtrace_minio}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-claimtrace_minio_secret_2026}
    command: server /data --console-address ":9001"
    volumes:
      - claimtrace_minio_data:/data

  loki:
    image: grafana/loki:3.2.0
    container_name: claimtrace-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - claimtrace_loki_data:/loki

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: claimtrace-keycloak
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-claimtrace2026}
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./infra/keycloak/claimtrace-realm.json:/opt/keycloak/data/import/claimtrace-realm.json:ro

  locust:
    image: locustio/locust:2.32.6
    container_name: claimtrace-locust
    restart: unless-stopped
    ports:
      - "8089:8089"
    command: ["-f", "/mnt/locust/locustfile.py", "--host", "http://reverse-proxy:80"]
    volumes:
      - ./loadtest:/mnt/locust:ro
    depends_on:
      - reverse-proxy

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: claimtrace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  claimtrace_postgres_data:
  claimtrace_redis_data:
  claimtrace_backups_data:
  claimtrace_prometheus_data:
  claimtrace_grafana_data:
  claimtrace_minio_data:
  claimtrace_loki_data:
