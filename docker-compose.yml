version: '3.8'

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: claimtrace-reverse-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/proxy-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: claimtrace-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-claimtrace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-claimtrace_local_dev}
      - POSTGRES_DB=${POSTGRES_DB:-claimtrace_db}
    volumes:
      - claimtrace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimtrace} -d ${POSTGRES_DB:-claimtrace_db}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: claimtrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - claimtrace_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimtrace-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - CLAIMTRACE_LLM_ENDPOINT=${CLAIMTRACE_LLM_ENDPOINT:-}
      - CLAIMTRACE_LLM_API_KEY=${CLAIMTRACE_LLM_API_KEY:-}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-claimtrace}:${POSTGRES_PASSWORD:-claimtrace_local_dev}@postgres:5432/${POSTGRES_DB:-claimtrace_db}
      - REDIS_URL=redis://redis:6379/0
      - CLAIMTRACE_TRUST_PROXY_HEADERS=1
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimtrace-async-worker
    restart: unless-stopped
    command: ["python3", "-m", "arq", "app.workers.async_worker.WorkerSettings"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-claimtrace}:${POSTGRES_PASSWORD:-claimtrace_local_dev}@postgres:5432/${POSTGRES_DB:-claimtrace_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: claimtrace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  claimtrace_postgres_data:
  claimtrace_redis_data:
