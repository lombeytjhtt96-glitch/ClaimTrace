global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    service: claimtrace-jkn
    environment: local-dev

rule_files:
  - /home/Khalaf-Dev/.gemini/antigravity/scratch/claimtrace-jkn/infra/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "claimtrace-backend"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          component: fastapi-dss

  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
