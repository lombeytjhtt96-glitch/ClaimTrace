worker_processes auto;
pid /tmp/claimtrace-nginx/nginx.pid;
error_log /tmp/claimtrace-nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/claimtrace-nginx/body;
    proxy_temp_path       /tmp/claimtrace-nginx/proxy;
    fastcgi_temp_path     /tmp/claimtrace-nginx/fastcgi;
    uwsgi_temp_path       /tmp/claimtrace-nginx/uwsgi;
    scgi_temp_path        /tmp/claimtrace-nginx/scgi;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 25m;

    access_log /tmp/claimtrace-nginx/access.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    limit_req_zone $binary_remote_addr zone=claimtrace_local_api:10m rate=100r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream claimtrace_local_frontend {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    upstream claimtrace_local_backend {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        add_header X-ClaimTrace-Proxy "nginx-edge-local" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /proxy-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","proxy":"nginx-edge-local","listen_port":8080,"upstream_frontend":"127.0.0.1:3000","upstream_backend":"127.0.0.1:8000"}';
        }

        location /api/ {
            limit_req zone=claimtrace_local_api burst=150 nodelay;
            proxy_pass http://claimtrace_local_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-ClaimTrace-Proxy "nginx-edge-local";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 120s;
            add_header Cache-Control "no-store, max-age=0" always;
        }

        location /fhir {
            proxy_pass http://claimtrace_local_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-ClaimTrace-Proxy "nginx-edge-local";
            proxy_set_header X-Request-ID $request_id;
            add_header Cache-Control "no-store, max-age=0" always;
        }

        location ~ ^/(sqladmin|admin-portal) {
            proxy_pass http://claimtrace_local_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-ClaimTrace-Proxy "nginx-edge-local";
            proxy_set_header X-Request-ID $request_id;
            add_header Cache-Control "no-store, max-age=0" always;
        }

        location ~ ^/(docs|redoc|openapi\.json|health|healthz|metrics)$ {
            proxy_pass http://claimtrace_local_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-ClaimTrace-Proxy "nginx-edge-local";
            proxy_set_header X-Request-ID $request_id;
        }

        # Vite SPA + WebSocket HMR passthrough
        location / {
            proxy_pass http://claimtrace_local_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
