worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 25m;

    # Structured access log with upstream timing
    log_format claimtrace_edge '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                               'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log claimtrace_edge;
    error_log  /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Edge rate limiting zones
    limit_req_zone $binary_remote_addr zone=claimtrace_auth_limit:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=claimtrace_api_limit:20m rate=60r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream claimtrace_frontend {
        server frontend:80;
        keepalive 32;
    }

    upstream claimtrace_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Edge security headers
        add_header X-ClaimTrace-Proxy "nginx-edge-docker" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

        # Dedicated Reverse Proxy health endpoint
        location = /proxy-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","proxy":"nginx-edge-docker","upstream_frontend":"frontend:80","upstream_backend":"backend:8000"}';
        }

        # Auth endpoints with stricter edge rate limit
        location /api/v1/auth/ {
            limit_req zone=claimtrace_auth_limit burst=20 nodelay;
            proxy_pass http://claimtrace_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-ClaimTrace-Proxy "nginx-edge-docker";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            add_header Cache-Control "no-store, max-age=0" always;
        }

        # Backend FastAPI REST & SSE endpoints
        location /api/ {
            limit_req zone=claimtrace_api_limit burst=120 nodelay;
            proxy_pass http://claimtrace_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-ClaimTrace-Proxy "nginx-edge-docker";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 120s;
            add_header Cache-Control "no-store, max-age=0" always;
        }

        # FHIR R4 SATUSEHAT interoperability endpoints
        location /fhir {
            limit_req zone=claimtrace_api_limit burst=60 nodelay;
            proxy_pass http://claimtrace_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-ClaimTrace-Proxy "nginx-edge-docker";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            add_header Cache-Control "no-store, max-age=0" always;
        }

        # OpenAPI docs passthrough
        location ~ ^/(docs|redoc|openapi\.json|health|healthz)$ {
            proxy_pass http://claimtrace_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-ClaimTrace-Proxy "nginx-edge-docker";
            proxy_set_header X-Request-ID $request_id;
        }

        # Frontend React SPA
        location / {
            proxy_pass http://claimtrace_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
